<a class="skip" href="#contenu">{{ t().shell.skip }}</a>
<header class="header">
  <button
    type="button"
    class="icon-btn"
    (click)="toggleNav()"
    [attr.aria-label]="navLabel()"
    [title]="navLabel()"
    [attr.aria-expanded]="navOpen()"
    aria-controls="nav-principale"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
  </button>
  <a routerLink="/a-traiter" class="brand">
    <span class="brand-name">mabecoju</span>
    <span class="brand-tag">{{ t().shell.tagline }}</span>
  </a>
  <a routerLink="/a-traiter" fragment="recherche" class="search" [attr.aria-label]="t().shell.search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span class="search-text">{{ t().shell.searchPlaceholder }}</span>
  </a>
  <div class="user">
    <span class="user-name">{{ fullName() }}</span>
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <mbj-lang-toggle class="lang" />
    <button type="button" class="icon-btn" (click)="logout()" [attr.aria-label]="t().shell.logout" [title]="t().shell.logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="m10 17-5-5 5-5"></path><path d="M5 12h11"></path></svg>
    </button>
  </div>
</header>

<div class="body">
  @if (navOpen()) {
    @if (narrow()) {
      <div class="backdrop" (click)="closeDrawer()" aria-hidden="true"></div>
    }
    <nav id="nav-principale" class="nav" [class.drawer]="narrow()" [attr.aria-label]="t().shell.mainNav">
      @if (narrow()) {
        <button type="button" class="nav-close" (click)="closeDrawer()">
          <span>{{ t().shell.closeMenu }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      }
      @for (item of items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ t().shell.nav[item.key] }}</a>
      }
      @if (narrow()) {
        <div class="nav-lang"><mbj-lang-toggle /></div>
      }
    </nav>
  }
  <main id="contenu" class="main" [class.with-nav]="navOpen() && !narrow()" tabindex="-1">
    <router-outlet />
  </main>
</div>
