spring:
  application:
    name: lexora
  datasource:
    # zeroDateTimeBehavior: the legacy data may hold '0000-00-00' dates, read as null
    url: jdbc:mysql://${LEXORA_DB_HOST:127.0.0.1}:${LEXORA_DB_PORT:3306}/${LEXORA_DB_NAME:lexora}?zeroDateTimeBehavior=CONVERT_TO_NULL&characterEncoding=UTF-8
    username: ${LEXORA_DB_USER:lexora}
    password: ${LEXORA_DB_PASSWORD:}
  mvc:
    problemdetails:
      # Spring MVC errors (validation, bad JSON, ...) as RFC 9457 problem details too
      enabled: true
  jackson:
    deserialization:
      # omitted flags and counters (billing, cash, delayDays, ...) default to false / 0
      fail-on-null-for-primitives: false
  liquibase:
    # schema migrations; the first run on the legacy database only records the baseline as applied
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LEXORA_LIQUIBASE_ENABLED:true}
  jpa:
    open-in-view: false
    hibernate:
      # the schema is owned by Liquibase (db/changelog): never let Hibernate change it
      ddl-auto: none
      naming:
        # keep column names exactly as written in @Column (e.g. fold_wayToOurOffice)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

lexora:
  time-zone: Europe/Zurich
  security:
    # keep MD5 hashes while the PHP application still authenticates against all_users
    legacy-password-hashing: true
    allowed-origins:
      - http://localhost:4200
  branding:
    # shown by the front end, also on the login page; each one can be set as LEXORA_BRANDING_<NAME>, e.g.
    # LEXORA_BRANDING_OFFICE_NAME. Optional ones are commented out. See the README for an example.
    product-name: Lexora
    # office-name: Étude Exemple        # the product name when absent
    # tagline-fr: juriste & médiatrice
    # tagline-en: lawyer & mediator      # the French tagline when absent
    accent-color: "#1d5fb4"
    # accent-dark-color: "#164a8c"      # derived from accent-color when absent
    # logo: file:/etc/lexora/logo.svg     # SVG, PNG, JPEG or WebP; a monogram in the accent colour when absent
    logo-includes-name: false
    # favicon: file:/etc/lexora/favicon.ico   # ICO, SVG or PNG; the monogram when absent
  documents:
    # identity of the office printed on the documents
    city: Neuchâtel
    signature: Marna Müller-Bessi
    author: Marna Müller-Bessi
    header-image: classpath:documents/header.png
    footer-image: classpath:documents/footer.png
    # TrueType font embedded in the documents (e.g. the licensed GOTHIC.TTF of the server); Helvetica when absent
    font-file: ${LEXORA_DOCUMENTS_FONT_FILE:}
    font-family: Century Gothic
    qr-bill:
      # QR-bills are printed once the account is set: a QR-IBAN gives QR references, a plain IBAN creditor references
      iban: ${LEXORA_QR_BILL_IBAN:}
      creditor-name: ${LEXORA_QR_BILL_CREDITOR_NAME:}
      street: ${LEXORA_QR_BILL_STREET:}
      house-number: ${LEXORA_QR_BILL_HOUSE_NUMBER:}
      postal-code: ${LEXORA_QR_BILL_POSTAL_CODE:}
      town: ${LEXORA_QR_BILL_TOWN:}
      country: CH

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  # API reference rendered from the contract, at /scalar
  url: /openapi/lexora_openapi_v1.yaml
  path: /scalar
  page-title: Lexora API
