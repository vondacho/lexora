openapi: 3.0.3
info:
  title: Lexora API
  version: 2.0.0
  description: |
    Back office of the office: client folders, fees (honoraries), provision requests, invoices, payment follow-up
    and the office books.

    - Every call needs HTTP Basic credentials of a user (`all_users`). Each operation requires the page grant of the
      legacy application noted in its description (`module:page`); `GET /api/me` returns the grants of the caller.
    - Amounts are in Swiss francs with two decimals. Rates are percentages (`7.7` for 7.7 %).
    - Errors are RFC 9457 problem details: 400 invalid request, 401 not authenticated, 403 missing grant,
      404 unknown resource, 422 business rule violated.
servers:
  - url: /
security:
  - basicAuth: []
tags:
  - name: Folders
    description: Client folders and their statuses
  - name: Customers
    description: Parties of a folder
  - name: Honoraries
    description: Billable services
  - name: Invoices
    description: Fee notes, their payments and reminders
  - name: AdvanceRequests
    description: Provision requests and their reminders
  - name: Advances
    description: Provisions received
  - name: Tickets
    description: Payment slips (BVR / QR references)
  - name: Debtors
    description: What customers owe and what they pay
  - name: BankStatements
    description: Import of the bank notifications (camt.054), matched to the invoices and advance requests they pay
  - name: Templates
    description: Document models and honorary wordings
  - name: Documents
    description: PDF documents generated on demand from the letter templates, with Swiss QR-bills
  - name: Settings
    description: Module defaults
  - name: Booking
    description: Outgoing payments and standing orders of the office and of tutelage folders
  - name: Vat
    description: VAT paid per period (net tax rate method)
  - name: Reports
    description: Financial reports
  - name: Users
    description: Users and grants

paths:
  # ----- folders ---------------------------------------------------------------------------------------------------
  /api/folders:
    get:
      tags: [Folders]
      operationId: searchFolders
      summary: Search folders
      description: Text criteria match by prefix; only the first given among name, number and customer is used. Grant `invoicing:folder_search`.
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: number, in: query, schema: { type: string } }
        - { name: customer, in: query, description: First or last name of a customer, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/FolderType' } }
      responses:
        '200':
          description: Folders ordered by name
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Folder' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Folders]
      operationId: openFolder
      summary: Open a folder, optionally with its first customer
      description: The folder number is its identifier. Grant `invoicing:folder_create`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenFolderInput' } } }
      responses:
        '201':
          description: Folder opened
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenedFolder' } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folders/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Folders]
      operationId: getFolder
      summary: Display a folder
      description: Grant `invoicing:folder_display`.
      responses:
        '200': { description: The folder, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Folders]
      operationId: updateFolder
      summary: Modify a folder
      description: Grant `invoicing:folder_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FolderInput' } } }
      responses:
        '200': { description: The modified folder, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Delete a folder and everything it holds
      description: Deletes its invoices, advance requests, advances, honoraries, payment slips, booking entries, standing orders and customers. Grant `invoicing:folder_modify`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/folder-statuses:
    get:
      tags: [Folders]
      operationId: listFolderStatuses
      summary: Proposed folder statuses
      responses:
        '200':
          description: Statuses ordered by name
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FolderStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Folders]
      operationId: addFolderStatus
      summary: Add a folder status
      description: Grant `invoicing:folder_status_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FolderStatusInput' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/FolderStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folder-statuses/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    delete:
      tags: [Folders]
      operationId: deleteFolderStatus
      summary: Remove a folder status
      description: Grant `invoicing:folder_status_modify`.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  # ----- customers -------------------------------------------------------------------------------------------------
  /api/folders/{folderId}/customers:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Customers of a folder
      description: Grant `invoicing:customer_display`.
      parameters:
        - { name: activeAt, in: query, description: Only the customers active on that day, schema: { type: string, format: date } }
      responses:
        '200':
          description: Customers ordered by start of activity
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Customers]
      operationId: addCustomer
      summary: Add a customer to a folder
      description: Grant `invoicing:customer_create`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/customers/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Display a customer
      description: Grant `invoicing:customer_display`.
      responses:
        '200': { description: The customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Modify a customer
      description: Grant `invoicing:customer_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '200': { description: The modified customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Customers]
      operationId: removeCustomer
      summary: Remove a customer entered by mistake
      description: |
        Refused (422) when the customer has a share of an invoice or request, a payment, an advance or a payment slip
        in the folder: set `activeUntil` instead. Grant `invoicing:customer_modify`.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  # ----- honoraries ------------------------------------------------------------------------------------------------
  /api/folders/{folderId}/honoraries:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Honoraries]
      operationId: listHonoraries
      summary: Honoraries of a folder
      description: Grant `invoicing:folder_honoraries`.
      parameters:
        - { name: invoiced, in: query, description: 'true for the invoiced ones, false for the open ones, absent for all', schema: { type: boolean } }
      responses:
        '200':
          description: Honoraries in chronological order
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Honorary' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Honoraries]
      operationId: recordHonorary
      summary: Record an honorary
      description: Amount = minutes / 60 × hourly rate + expenses. Grant `invoicing:honorary_create`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HonoraryInput' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Honorary' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/honoraries/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Honoraries]
      operationId: getHonorary
      summary: Display an honorary
      description: Grant `invoicing:folder_honoraries`.
      responses:
        '200': { description: The honorary, content: { application/json: { schema: { $ref: '#/components/schemas/Honorary' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Honoraries]
      operationId: reviseHonorary
      summary: Modify an open honorary
      description: Refused (422) once the honorary is invoiced. Grant `invoicing:honorary_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HonoraryInput' } } }
      responses:
        '200': { description: The modified honorary, content: { application/json: { schema: { $ref: '#/components/schemas/Honorary' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Honoraries]
      operationId: deleteHonorary
      summary: Delete an open honorary
      description: Refused (422) once the honorary is invoiced. Grant `invoicing:honorary_modify`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  # ----- invoices --------------------------------------------------------------------------------------------------
  /api/folders/{folderId}/invoices:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Invoices]
      operationId: listFolderInvoices
      summary: Invoices of a folder
      description: Grant `invoicing:folder_invoices`.
      responses:
        '200':
          description: Invoices, most recent first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Invoices]
      operationId: issueInvoice
      summary: Issue an invoice
      description: |
        Bills every open honorary of the folder and deducts every available advance.
        Discount and shares are rounded to 5 centimes; VAT is truncated to 10 centimes;
        amount = honoraries − discount + VAT − advances. Grant `invoicing:invoice_create`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceTermsInput' } } }
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folders/{folderId}/invoice-draft:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Invoices]
      operationId: prepareInvoice
      summary: What the next invoice of the folder would contain
      description: Grant `invoicing:invoice_create`.
      responses:
        '200': { description: The draft, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraft' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoicesByStatus
      summary: Open or paid invoices
      description: Grant `invoicing:debtors_open` or `invoicing:debtors_payed`.
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [open, paid] }
      responses:
        '200':
          description: Open invoices oldest first, or paid invoices most recently paid first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Display an invoice
      description: Grant `invoicing:invoice_display`.
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Invoices]
      operationId: reviseInvoice
      summary: Modify date, delay, discount, VAT or shares
      description: Grant `invoicing:invoice_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceTermsInput' } } }
      responses:
        '200': { description: The modified invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Invoices]
      operationId: deleteInvoice
      summary: Delete an invoice
      description: Its honoraries and advances become open again; its payments and reminders are deleted. Grant `invoicing:invoice_modify`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/honoraries:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Invoices]
      operationId: listInvoicedHonoraries
      summary: Honoraries billed by the invoice
      description: Grant `invoicing:invoice_display`.
      responses:
        '200':
          description: Honoraries
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Honorary' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/advances:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Invoices]
      operationId: listDeductedAdvances
      summary: Advances deducted on the invoice
      description: Grant `invoicing:invoice_display`.
      responses:
        '200':
          description: Advances
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Advance' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/settlement:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Invoices]
      operationId: settleInvoice
      summary: Mark the invoice as paid ("solder")
      description: Today when no date is given. Grant `invoicing:invoice_modify`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DateInput' } } }
      responses:
        '200': { description: The settled invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Invoices]
      operationId: reopenInvoice
      summary: Reopen the invoice
      description: Grant `invoicing:invoice_modify`.
      responses:
        '200': { description: The reopened invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/recalls:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Invoices]
      operationId: recallInvoice
      summary: Send the next reminder
      description: Claims what is still due; today when no date is given. Grant `invoicing:invoice_modify`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DateInput' } } }
      responses:
        '201': { description: The invoice with its new reminder, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/recalls/{recallId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: recallId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Invoices]
      operationId: cancelInvoiceRecall
      summary: Cancel a reminder
      description: Grant `invoicing:invoice_modify`.
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/payments:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Invoices]
      operationId: recordInvoicePayment
      summary: Record a payment
      description: The invoice is settled once payments cover its amount within 1 CHF. Grant `invoicing:debtor_receipt`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePaymentInput' } } }
      responses:
        '201': { description: The invoice with the payment, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/payments/{paymentId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: paymentId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Invoices]
      operationId: cancelInvoicePayment
      summary: Cancel a payment
      description: The invoice is reopened unless the remaining payments still cover it. Grant `invoicing:invoice_modify`.
      responses:
        '200': { description: The invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ----- advance requests ------------------------------------------------------------------------------------------
  /api/folders/{folderId}/advance-requests:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [AdvanceRequests]
      operationId: listFolderAdvanceRequests
      summary: Advance requests of a folder
      description: Grant `invoicing:folder_requests`.
      parameters:
        - { name: paid, in: query, schema: { type: boolean } }
        - { name: invoiced, in: query, description: Whether all its advances were deducted on an invoice, schema: { type: boolean } }
      responses:
        '200':
          description: Requests, most recent first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [AdvanceRequests]
      operationId: createAdvanceRequest
      summary: Request a provision
      description: Grant `invoicing:request_create`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequestTermsInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folders/{folderId}/advance-request-draft:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [AdvanceRequests]
      operationId: prepareAdvanceRequest
      summary: Figures shown when preparing a request
      description: Grant `invoicing:request_create`.
      responses:
        '200': { description: The draft, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequestDraft' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests:
    get:
      tags: [AdvanceRequests]
      operationId: listOpenAdvanceRequests
      summary: Unpaid advance requests
      description: Grant `invoicing:debtors_open`.
      responses:
        '200':
          description: Requests, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [AdvanceRequests]
      operationId: getAdvanceRequest
      summary: Display an advance request with its advances
      description: Grant `invoicing:request_display`.
      responses:
        '200': { description: The request, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [AdvanceRequests]
      operationId: reviseAdvanceRequest
      summary: Modify an advance request
      description: Grant `invoicing:request_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequestTermsInput' } } }
      responses:
        '200': { description: The modified request, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AdvanceRequests]
      operationId: deleteAdvanceRequest
      summary: Delete an advance request and its advances
      description: Grant `invoicing:request_modify`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}/settlement:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [AdvanceRequests]
      operationId: settleAdvanceRequest
      summary: Mark the request as paid
      description: Today when no date is given. Grant `invoicing:request_modify`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DateInput' } } }
      responses:
        '200': { description: The settled request, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [AdvanceRequests]
      operationId: reopenAdvanceRequest
      summary: Reopen the request
      description: Grant `invoicing:request_modify`.
      responses:
        '200': { description: The reopened request, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}/recalls:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [AdvanceRequests]
      operationId: recallAdvanceRequest
      summary: Send the next reminder
      description: Today when no date is given. Grant `invoicing:request_modify`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DateInput' } } }
      responses:
        '201': { description: The request with its new reminder, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}/recalls/{recallId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: recallId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [AdvanceRequests]
      operationId: cancelAdvanceRequestRecall
      summary: Cancel a reminder
      description: Grant `invoicing:request_modify`.
      responses:
        '200': { description: The request, content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ----- advances --------------------------------------------------------------------------------------------------
  /api/folders/{folderId}/advances:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Advances]
      operationId: listAdvances
      summary: Advances of a folder
      description: Grant `invoicing:folder_content`.
      parameters:
        - { name: invoiced, in: query, description: 'true for the advances deducted on an invoice, false for the available ones', schema: { type: boolean } }
      responses:
        '200':
          description: Advances, most recent first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Advance' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Advances]
      operationId: receiveAdvance
      summary: Receive an advance, answering a request or not
      description: The request is settled once its advances cover it within 1 CHF. Grant `invoicing:advance_receipt`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdvanceInput' } } }
      responses:
        '201': { description: Received, content: { application/json: { schema: { $ref: '#/components/schemas/Advance' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/advances/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Advances]
      operationId: getAdvance
      summary: Display an advance
      description: Grant `invoicing:folder_content`.
      responses:
        '200': { description: The advance, content: { application/json: { schema: { $ref: '#/components/schemas/Advance' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Advances]
      operationId: cancelAdvance
      summary: Cancel an advance not yet deducted on an invoice
