      responses:
        '204': { description: Cancelled }
        default: { $ref: '#/components/responses/Problem' }

  # ----- tickets ---------------------------------------------------------------------------------------------------
  /api/folders/{folderId}/tickets:
    parameters: [ { $ref: '#/components/parameters/FolderId' } ]
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Payment slips of a folder
      description: Grant `invoicing:folder_content`.
      responses:
        '200':
          description: Payment slips
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Tickets]
      operationId: registerTicket
      summary: Register a typed or scanned payment slip reference
      description: Optionally issued for an invoice or an advance request of the folder. A known reference is returned as is, except for cash slips ("Comptant"). Grant `invoicing:folder_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketInput' } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Display a payment slip
      description: Grant `invoicing:folder_content`.
      responses:
        '200': { description: The payment slip, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Tickets]
      operationId: renumberTicket
      summary: Correct the reference of a payment slip
      description: Grant `invoicing:invoice_modify`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketNumberInput' } } }
      responses:
        '200': { description: The payment slip, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      summary: Delete a payment slip used by no payment nor advance
      description: Grant `invoicing:folder_modify`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  # ----- debtors ---------------------------------------------------------------------------------------------------
  /api/debtors/overview:
    get:
      tags: [Debtors]
      operationId: getDebtorsOverview
      summary: Folders to invoice, open invoices and open requests
      description: Grant `invoicing:debtors_open`.
      responses:
        '200': { description: The overview, content: { application/json: { schema: { $ref: '#/components/schemas/DebtorsOverview' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/debtors/lookup:
    get:
      tags: [Debtors]
      operationId: lookupTicket
      summary: Find the debtor of a typed or scanned payment slip reference
      description: Grant `invoicing:debtor_search`.
      parameters:
        - { name: reference, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: The debtor, content: { application/json: { schema: { $ref: '#/components/schemas/TicketLookup' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folders/{folderId}/customers/{customerId}/statement:
    parameters:
      - { $ref: '#/components/parameters/FolderId' }
      - { $ref: '#/components/parameters/CustomerId' }
    get:
      tags: [Debtors]
      operationId: getCustomerStatement
      summary: What the customer still owes
      description: Open invoices and requests of the folder with a positive remainder for the customer. Grant `invoicing:debtor_receipt`.
      responses:
        '200': { description: The statement, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerStatement' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/folders/{folderId}/customers/{customerId}/receipts:
    parameters:
      - { $ref: '#/components/parameters/FolderId' }
      - { $ref: '#/components/parameters/CustomerId' }
    post:
      tags: [Debtors]
      operationId: receivePayments
      summary: Record what the customer paid on several invoices and requests
      description: Invoice lines become invoice payments, request lines become advances; zero lines are ignored. Grant `invoicing:debtor_receipt`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptInput' } } }
      responses:
        '200': { description: The statement after the receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerStatement' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ----- bank statements -------------------------------------------------------------------------------------------
  /api/bank-statements/analysis:
    post:
      tags: [BankStatements]
      operationId: analyseBankStatement
      summary: Read a camt.054 file and match its credits
      description: |
        Each credit is matched by its payment reference (the payment slip registered when printing, or the
        reference itself) or, without one, suggested by amount and payer name. Transactions already imported are
        DUPLICATE. Debits are left out. Nothing is recorded. Grant `invoicing:debtor_receipt`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BankStatementInput' } } }
      responses:
        '200': { description: The credits and what they pay, content: { application/json: { schema: { $ref: '#/components/schemas/BankStatementAnalysis' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /api/bank-statements/receipts:
    post:
      tags: [BankStatements]
      operationId: recordBankReceipts
      summary: Record the credits confirmed for their documents
      description: |
        Each receipt is recorded as an invoice payment or an advance answering the request; beyond what the customer
        owes (with a tolerance of 1 CHF) the rest becomes a spontaneous advance of the folder. A receipt already in
        the books is skipped: the same bank transaction (`entryReference`), or without it the same document, customer,
        date and amount. All or nothing.
        Grant `invoicing:debtor_receipt`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BankReceiptsInput' } } }
      responses:
        '200': { description: 'One result per receipt, in order', content: { application/json: { schema: { $ref: '#/components/schemas/BankReceiptsResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ----- documents -------------------------------------------------------------------------------------------------
  /api/invoices/{id}/document:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Documents]
      operationId: printInvoice
      summary: Print an invoice
      description: |
        One copy per active customer (or a single one with merged addresses), each followed by a QR-bill for what
        its recipient still owes. Nothing is stored. Grant `invoicing:invoice_display`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrintInput' } } }
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/Problem' }
  /api/invoices/{id}/recalls/{recallId}/document:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: recallId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Documents]
      operationId: printInvoiceRecall
      summary: Print a reminder of an invoice
      description: Amounts and QR-bills claim what each customer still owes. Grant `invoicing:invoice_display`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrintInput' } } }
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}/document:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Documents]
      operationId: printAdvanceRequest
      summary: Print an advance request
      description: Grant `invoicing:request_display`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrintInput' } } }
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/Problem' }
  /api/advance-requests/{id}/recalls/{recallId}/document:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: recallId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Documents]
      operationId: printAdvanceRequestRecall
      summary: Print a reminder of an advance request
      description: Grant `invoicing:request_display`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrintInput' } } }
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        default: { $ref: '#/components/responses/Problem' }

  # ----- templates -------------------------------------------------------------------------------------------------
  /api/document-models:
    get:
      tags: [Templates]
      operationId: listDocumentModels
      summary: Document models
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/DocumentType' } }
