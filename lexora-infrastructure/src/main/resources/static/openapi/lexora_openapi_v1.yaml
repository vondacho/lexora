    delete:
      tags: [Templates]
      operationId: deleteDocumentModel
      summary: Delete a document model
      description: Grant `invoicing:models`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/wordings:
    get:
      tags: [Templates]
      operationId: listWordings
      summary: Predefined honorary descriptions
      responses:
        '200':
          description: Wordings in alphabetical order
