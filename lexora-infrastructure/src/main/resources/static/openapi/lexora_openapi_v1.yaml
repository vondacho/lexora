    put:
      tags: [Templates]
      operationId: updateDocumentModel
      summary: Modify a document model
      description: Grant `invoicing:models`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentModelInput' } } }
      responses:
        '200': { description: The modified model, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentModel' } } } }
