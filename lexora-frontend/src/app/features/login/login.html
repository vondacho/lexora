<main class="page">
  <form class="card login" (ngSubmit)="submit()" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-name">lexora</span>
      <span class="muted">{{ t().shell.tagline }}</span>
      <lx-lang-toggle class="lang" />
    </div>
    <h1 id="login-title">{{ t().login.title }}</h1>
    <div class="field">
      <label for="username">{{ t().login.username }}</label>
      <input id="username" name="username" class="input" autocomplete="username" required [(ngModel)]="username" autofocus />
    </div>
    <div class="field">
      <label for="password">{{ t().login.password }}</label>
      <input id="password" name="password" type="password" class="input" autocomplete="current-password" required [(ngModel)]="password" />
    </div>
    @if (error(); as e) {
      <p class="problem" role="alert">{{ e === 'credentials' ? t().login.badCredentials : t().common.serverDown }}</p>
    }
    <button type="submit" class="btn btn-primary" [disabled]="busy()">
      {{ busy() ? t().login.busy : t().login.submit }}
    </button>
  </form>
</main>
