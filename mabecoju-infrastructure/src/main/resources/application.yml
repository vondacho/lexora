spring:
  application:
    name: mabecoju
  datasource:
    # zeroDateTimeBehavior: the legacy data may hold '0000-00-00' dates, read as null
    url: jdbc:mysql://${MABECOJU_DB_HOST:127.0.0.1}:${MABECOJU_DB_PORT:3306}/${MABECOJU_DB_NAME:mabecoju}?zeroDateTimeBehavior=CONVERT_TO_NULL&characterEncoding=UTF-8
    username: ${MABECOJU_DB_USER:mabecoju}
    password: ${MABECOJU_DB_PASSWORD:}
  mvc:
    problemdetails:
      # Spring MVC errors (validation, bad JSON, ...) as RFC 9457 problem details too
      enabled: true
  jackson:
    deserialization:
      # omitted flags and counters (billing, cash, delayDays, ...) default to false / 0
      fail-on-null-for-primitives: false
  liquibase:
    # schema migrations; the first run on the legacy database only records the baseline as applied
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${MABECOJU_LIQUIBASE_ENABLED:true}
  jpa:
    open-in-view: false
    hibernate:
      # the schema is owned by Liquibase (db/changelog): never let Hibernate change it
      ddl-auto: none
      naming:
        # keep column names exactly as written in @Column (e.g. fold_wayToOurOffice)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

mabecoju:
  time-zone: Europe/Zurich
  security:
    # keep MD5 hashes while the PHP application still authenticates against all_users
    legacy-password-hashing: true
    allowed-origins:
      - http://localhost:4200
  documents:
    # identity of the office printed on the documents
    city: Neuchâtel
    signature: Marna Müller-Bessi
    author: Marna Müller-Bessi
    header-image: classpath:documents/header.png
    footer-image: classpath:documents/footer.png
    # TrueType font embedded in the documents (e.g. the licensed GOTHIC.TTF of the server); Helvetica when absent
    font-file: ${MABECOJU_DOCUMENTS_FONT_FILE:}
    font-family: Century Gothic
    qr-bill:
      # QR-bills are printed once the account is set: a QR-IBAN gives QR references, a plain IBAN creditor references
      iban: ${MABECOJU_QR_BILL_IBAN:}
      creditor-name: ${MABECOJU_QR_BILL_CREDITOR_NAME:}
      street: ${MABECOJU_QR_BILL_STREET:}
      house-number: ${MABECOJU_QR_BILL_HOUSE_NUMBER:}
      postal-code: ${MABECOJU_QR_BILL_POSTAL_CODE:}
      town: ${MABECOJU_QR_BILL_TOWN:}
      country: CH

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  # API reference rendered from the contract, at /scalar
  url: /openapi/mabecoju_openapi_v1.yaml
  path: /scalar
  page-title: mabecoju API
